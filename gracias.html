<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tercer Turno · ¡Gracias por tu compra!</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Página a la que vuelve el comprador después de pagar (se configura como "URL de retorno" del link de Mercado Pago). */
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0e1726;color:#f3f1ea;font:17px/1.55 "IBM Plex Sans",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{max-width:620px;text-align:center}
img{width:72px;margin-bottom:22px}
h1{font:900 clamp(40px,8vw,64px)/.95 Archivo;font-stretch:72%;text-transform:uppercase}
h1 span{color:#f5b301}
p{color:#c3cad4;margin:18px 0 28px}
a{display:inline-block;background:#f5b301;color:#0e1726;text-decoration:none;font:800 19px Archivo;font-stretch:85%;text-transform:uppercase;padding:15px 24px;border-radius:12px}
small{display:block;margin-top:22px;color:#8a94a3;font-size:14px}
</style>
</head>
<body>
<main>
  <img src="img/favicon.svg" alt="">
  <h1>¡Gracias por <span>tu compra!</span></h1>
  <p>Mandanos el comprobante de pago por WhatsApp y te llegan los archivos hoy mismo.</p>
  <a id="wa" href="#">Mandar comprobante</a>
  <small>Tercer Turno · Automatización con IA para pymes</small>
</main>
<script>
document.getElementById("wa").href = "https://wa.me/5493471332479?text=" + encodeURIComponent("Hola, ya pagué. Te mando el comprobante.");
</script>
</body>
